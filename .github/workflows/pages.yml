name: Test and deploy Pages
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Test
        run: node --test tests/*.test.mjs
      - name: Prepare public configuration
        run: node scripts/prepare-config.mjs
        env:
          CLOUDFLARE_SYNC_URL: ${{ vars.CLOUDFLARE_SYNC_URL }}
      - name: Build migration page
        run: node scripts/build-pages.mjs
      - name: Version browser assets
        run: node scripts/prepare-assets.mjs .pages-build
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: .pages-build
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
