<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Кана — перенос прогресса</title><style>body{margin:0;background:#f6f5ef;color:#2e352b;font:16px/1.6 system-ui,sans-serif}main{max-width:480px;margin:12vh auto;padding:24px}h1{font-size:27px}p{color:#66735b}input,button{box-sizing:border-box;width:100%;font:inherit;padding:14px;border-radius:12px}input{border:1px solid #ccd6be;background:#fffefa;margin:8px 0 14px}button{border:0;background:#e77650;color:white;cursor:pointer;margin:8px 0}label{display:block}a{color:#526147}.secondary{background:#e9efdf;color:#526147}#status{min-height:48px}.error{color:#9f482d}#choices button{text-align:left}small{display:block;margin:8px 0;color:#66735b}</style></head><body><main><h1>Кана переехала</h1><p>Приложение открывается по ключу. Сначала сохраним прогресс с этого устройства в облако.</p><p id="status" role="status">Проверка сохранения…</p><form id="connect"><label for="key">Ключ синхронизации</label><input id="key" name="key" type="password" minlength="32" maxlength="128" autocomplete="current-password" required><button>Перенести и открыть</button></form><div id="choices"></div><button id="backup" class="secondary">Скачать местное сохранение</button><small><a id="open">Открыть приложение без переноса</a></small></main><script type="module" src="migrate.mjs"></script></body></html>
